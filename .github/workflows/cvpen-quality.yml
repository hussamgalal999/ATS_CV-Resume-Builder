name: CVPen App Quality Gate
on:
  pull_request:
    paths:
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cvpen-quality.yml'
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'components/**'
      - 'utils/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cvpen-quality.yml'
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: Run CV analysis and validation tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
