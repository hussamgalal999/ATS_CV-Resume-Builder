# Self-healing pilot for the CVPen demo (ATS_CV-Resume-Builder)
# ---------------------------------------------------------------------------
# What it does:
#   1. Probes the live demo URL every 30 minutes and on every push to main.
#   2. Runs the repo build (yarn install --frozen-lockfile + yarn build).
#   3. On failure: opens (or updates) a GitHub issue with a diagnosis.
#   4. For ONE well-understood failure class only (lockfile out of sync),
#      it regenerates yarn.lock on a fix branch and opens a PR. No merge.
# What it NEVER does:
#   - Never merges anything. Never deploys anything. Never touches secrets,
#     payments or user data. Never edits files outside this repo.
# Kill-switch: if a file named `.self-healing-paused` exists at the repo root,
#   all auto-fix steps are skipped (probing and reporting continue).
# Telegram notify is optional: it only runs when the repo secrets
# TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_CHAT_ID are set.
# ---------------------------------------------------------------------------

name: Self-healing pilot (CVPen demo)

on:
  schedule:
    - cron: "*/30 * * * *" # every 30 minutes (public repos: free)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to create the fix branch for the lockfile class
  issues: write
  pull-requests: write

env:
  LIVE_URL: "https://cv0-builder.netlify.app/"
  LIVE_MARKER: "ATS" # expected text on the live page (owner can change it)
  SLOW_MS: "10000" # response slower than this is classed SLOW (report only)

jobs:
  probe-and-build:
    runs-on: ubuntu-latest
    outputs:
      failure_class: ${{ steps.classify.outputs.class }}
      diagnosis_file: ${{ steps.probe.outputs.diagnosis_file }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Kill-switch check
        id: killswitch
        run: |
          if [ -f .self-healing-paused ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "Self-healing is PAUSED (.self-healing-paused exists). Probing only."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe the live demo
        id: probe
        run: |
          node .github/scripts/check-live.js \
            --url "$LIVE_URL" \
            --marker "$LIVE_MARKER" \
            --slow-ms "$SLOW_MS" \
            --out diagnosis.json || true
          echo "diagnosis_file=diagnosis.json" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        id: install
        run: yarn install --frozen-lockfile
        continue-on-error: true

      - name: Build
        id: build
        if: steps.install.outcome == 'success'
        run: yarn build
        continue-on-error: true

      - name: Classify failure
        id: classify
        run: |
          PROBE_CLASS=$(node -e "console.log(require('./diagnosis.json').failure_class || 'OK')")
          if [ "$PROBE_CLASS" != "OK" ] && [ "$PROBE_CLASS" != "SLOW" ]; then
            echo "class=$PROBE_CLASS" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.install.outcome }}" != "success" ]; then
            # Was it a lockfile drift? The install log tells us.
            if yarn install --frozen-lockfile 2>&1 | grep -qi "lockfile"; then
              echo "class=LOCKFILE_DRIFT" >> "$GITHUB_OUTPUT"
            else
              echo "class=BUILD_FAIL" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "class=BUILD_FAIL" >> "$GITHUB_OUTPUT"
          elif [ "$PROBE_CLASS" = "SLOW" ]; then
            echo "class=SLOW" >> "$GITHUB_OUTPUT"
          else
            echo "class=OK" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected class: $(grep '^class=' "$GITHUB_OUTPUT" | cut -d= -f2)"

      - name: Collect build log tail (for the issue body)
        if: steps.classify.outputs.class != 'OK'
        run: |
          {
            echo "## Build log (tail)"
            echo '```'
            yarn build 2>&1 | tail -40 || true
            echo '```'
          } >> diagnosis.json.md || true

      - name: Open or update issue with the diagnosis
        if: steps.classify.outputs.class != 'OK'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const diag = JSON.parse(fs.readFileSync('diagnosis.json', 'utf8'));
            const cls = '${{ steps.classify.outputs.class }}';
            const title = `[self-healing] ${cls} detected on CVPen demo`;
            const body = [
              `**Failure class:** ${cls}`,
              `**Live URL:** ${process.env.LIVE_URL}`,
              `**Detected at:** ${new Date().toISOString()}`,
              `**Probe result:** HTTP ${diag.http_status ?? 'n/a'}, ${diag.response_ms ?? 'n/a'} ms, marker ${diag.marker_found ? 'found' : 'MISSING'}`,
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '### Diagnosis',
              '```json',
              JSON.stringify(diag, null, 2),
              '```',
              '',
              'Opened automatically by the self-healing pilot. No merge and no deploy happens from this workflow.',
            ].join('\n');
            // Reuse an existing open issue for the same class instead of spamming.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: `self-healing,${cls.toLowerCase()}`,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body: `Still failing at ${new Date().toISOString()}.\n\n${body}`,
              });
              core.info(`Updated existing issue #${existing.data[0].number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['self-healing', cls.toLowerCase(), 'needs-human'],
              });
              core.info(`Created issue #${issue.data.number}`);
            }

      - name: Bounded auto-fix — lockfile drift only
        if: steps.classify.outputs.class == 'LOCKFILE_DRIFT' && steps.killswitch.outputs.paused == 'false'
        run: |
          BRANCH="self-healing/fix-lockfile-$(date +%Y%m%d-%H%M)"
          git config user.name "self-healing-bot"
          git config user.email "self-healing-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          yarn install # regenerates yarn.lock to match package.json
          git add yarn.lock
          git commit -m "self-healing: regenerate yarn.lock (lockfile drift)" || echo "nothing to commit"
          git push origin "$BRANCH"
          gh pr create \
            --title "self-healing: regenerate yarn.lock (lockfile drift)" \
            --body "Automatic fix attempt by the self-healing pilot. The frozen lockfile no longer matched package.json, so yarn.lock was regenerated. **This PR is NOT merged automatically — the owner reviews and merges.** Closes the related self-healing issue once merged and the build is green." \
            --label self-healing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify owner on Telegram (optional)
        if: steps.classify.outputs.class != 'OK' && steps.classify.outputs.class != 'SLOW'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_OWNER_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping notify (this is expected until the owner adds them)."
            exit 0
          fi
          MSG="⚠️ CVPen demo self-healing: ${{ steps.classify.outputs.class }} detected on $LIVE_URL — see the self-healing issue in hussamgalal999/ATS_CV-Resume-Builder."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_OWNER_CHAT_ID}" \
            --data-urlencode "text=${MSG}" > /dev/null
          echo "Telegram notification sent."
